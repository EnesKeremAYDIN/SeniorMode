name: Shuffle Lab Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shuffle-pages.yml'
      - 'assets/brand/logo.svg'
      - 'demo/shuffle/**'
      - 'examples/shuffle*.mjs'
      - 'scripts/build-shuffle-lab.js'
      - 'test/shuffle.test.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shuffle-lab-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: node --test test/shuffle.test.js
      - run: node scripts/build-shuffle-lab.js _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
