name: Bug report
description: Report a product bug, documentation issue, or accessibility barrier.
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: Affected page or SeniorMode and Node versions
      description: For documentation issues, include the page URL and language.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include what you expected and the steps to reproduce it. Add the operating system, browser, agent, or assistive technology if relevant.
    validations:
      required: true
